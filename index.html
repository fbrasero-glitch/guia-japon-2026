<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="Guía interactiva del viaje a Japón 2026 - Centro de Mando">
    <meta name="theme-color" content="#0d1117">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/castillo_osaka.png">
    <title>Japón 2026 | Centro de Mando</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-hidden">
    <!-- Overlay de Inicio de Sesión -->
    <div id="login-overlay" class="login-overlay">
        <div class="login-box">
            <div class="login-logo">
                <i class="fa-solid fa-torii-gate"></i>
                <span>JAPÓN 2026</span>
            </div>
            <h2>Acceso al Centro de Mando</h2>
            <p>Introduce las credenciales para continuar</p>
            <form id="login-form" onsubmit="event.preventDefault(); window.checkLogin();">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" placeholder="Usuario" required autocomplete="username">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn">
                    <span>INICIAR SESIÓN</span>
                    <i class="fa-solid fa-right-to-bracket"></i>
                </button>
                <div id="login-error" class="login-error" style="display: none;">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>Credenciales incorrectas</span>
                </div>
            </form>
        </div>
    </div>

    <!-- Overlay para cerrar menú móvil -->

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Botón toggle para navegación móvil -->
    <button class="mobile-nav-toggle" aria-label="Abrir menú de navegación" aria-expanded="false"
        id="mobile-nav-toggle">
        <i class="fa-solid fa-bars" id="menu-icon"></i> <span id="menu-text">Menú</span>
    </button>

    <!-- Botón toggle para HUD táctico en móvil -->
    <button class="mobile-hud-toggle" id="mobile-hud-toggle" aria-label="Cambiar vista HUD">
        <div class="hud-toggle-inner">
            <span class="view-label active" id="label-visual">VISUAL</span>
            <div class="toggle-switch"></div>
            <span class="view-label" id="label-hud">HUD</span>
        </div>
    </button>

    <nav class="sidebar" id="sidebar" aria-label="Navegación principal">
        <div class="logo">
            <i class="fa-solid fa-torii-gate"></i>
            <span>JAPÓN 2026</span>
        </div>
        <div id="day-list" role="list"></div>
        <div id="update-container" class="update-section">
            <span id="app-version-label">Buscando versión...</span>
            <button id="btn-check-update" class="btn-text">Buscar actualización</button>
        </div>
    </nav>

    <div class="center-stage">
        <video id="intro-video" class="intro-video" autoplay loop muted playsinline>
            <source src="video/videoplayback.mp4" type="video/mp4">
        </video>

        <div id="visual-card" class="visual-card">
        </div>
    </div>

    <aside class="right-panel" aria-label="Información del día">
        <div id="info-content">
        </div>
    </aside>

    <div id="hover-preview" class="hover-preview">
        <div class="preview-title" id="preview-title">Día X</div>
    </div>

    <!-- DATOS MODULARES (divididos por bloques de días para mejor rendimiento) -->
    <script src="data_restaurants.js"></script>
    <script src="data_dias_00_08.js"></script>
    <script src="data_dias_09_16.js"></script>
    <script src="data_dias_17_24.js"></script>
    <script src="data_combinator.js"></script>

    <!-- MODAL PARA INFOGRAFÍAS -->
    <div id="infographic-modal" class="infographic-modal" onclick="closeInfographic()">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modal-img">
    </div>

    <!-- CONFIGURACIÓN SUPABASE Y PERSISTENCIA -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://bgnrjfanmheylutlroia.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_2YmXljKcXIsAXTZ8_XG9SA_V2sniyXQ';
        
        // Inicializar cliente de Supabase (Probando diferentes nombres del global)
        try {
            const lib = window.supabase || window.supabaseJs;
            if (lib && typeof lib.createClient === 'function') {
                window.supabaseClient = lib.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('Supabase: Cliente inicializado correctamente');
            } else {
                console.error('Supabase: No se encontró la librería en window.supabase o window.supabaseJs');
            }
        } catch (e) {
            console.error('Supabase: Error durante la inicialización:', e);
        }
    </script>
    <script src="persistence.js"></script>
    <script src="script_engine.js"></script>
    <script src="script_tactical.js"></script>
    
    <!-- REGISTRO DEL SERVICE WORKER (Para funcionamiento Offline PWA) -->
    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const errorMsg = "Error: " + msg + "\nURL: " + url + "\nLínea: " + lineNo + "\nColumna: " + columnNo;
            console.error(errorMsg);
            // alert(errorMsg); // Comentado para no molestar, pero útil si el usuario no mira la consola
            return false;
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('[PWA] Service Worker registrado con éxito. Ámbito:', registration.scope);
                    })
                    .catch(error => {
                        console.log('[PWA] Fallo al registrar el Service Worker:', error);
                    });
            });
        }
    </script>

    <!-- Toast de actualización disponible -->
    <div id="update-toast" class="update-toast hidden">
        <div class="update-toast-content">
            <span class="update-toast-emoji">✨</span>
            <div class="update-toast-body">
                <h4>¡Actualización lista!</h4>
                <p>Nueva versión <span id="update-toast-version">v-</span> disponible.</p>
            </div>
            <div class="update-toast-actions">
                <button id="btn-update-now" class="btn-primary-small">Actualizar</button>
                <button id="btn-update-close" class="btn-close-toast">✕</button>
            </div>
        </div>
    </div>
</body>

</html>
