<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="Guía interactiva del viaje a Japón 2026 - Centro de Mando">
    <title>Japón 2026 | Centro de Mando</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Overlay para cerrar menú móvil -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Botón toggle para navegación móvil -->
    <button class="mobile-nav-toggle" aria-label="Abrir menú de navegación" aria-expanded="false"
        id="mobile-nav-toggle">
        <i class="fa-solid fa-bars" id="menu-icon"></i> <span id="menu-text">Menú</span>
    </button>

    <!-- Botón toggle para HUD táctico en móvil -->
    <button class="mobile-hud-toggle" id="mobile-hud-toggle" aria-label="Cambiar vista HUD">
        <div class="hud-toggle-inner">
            <span class="view-label active" id="label-visual">VISUAL</span>
            <div class="toggle-switch"></div>
            <span class="view-label" id="label-hud">HUD</span>
        </div>
    </button>

    <nav class="sidebar" id="sidebar" aria-label="Navegación principal">
        <div class="logo">
            <i class="fa-solid fa-torii-gate"></i>
            <span>JAPÓN 2026</span>
        </div>
        <div id="day-list" role="list"></div>
    </nav>

    <div class="center-stage">
        <video id="intro-video" class="intro-video" autoplay loop muted playsinline>
            <source src="video/videoplayback.mp4" type="video/mp4">
        </video>
        <div id="map"></div>

        <div id="visual-card" class="visual-card">
        </div>
    </div>

    <aside class="right-panel" aria-label="Información del día">
        <div id="info-content">
        </div>
    </aside>

    <div id="hover-preview" class="hover-preview">
        <div id="preview-map-container"></div>
        <div class="preview-title" id="preview-title">Día X</div>
    </div>

    <!-- DATOS MODULARES (divididos por bloques de días para mejor rendimiento) -->
    <script src="data_dias_00_08.js"></script>
    <script src="data_dias_09_16.js"></script>
    <script src="data_dias_17_24.js"></script>
    <script src="data_combinator.js"></script>

    <!-- MODAL PARA INFOGRAFÍAS -->
    <div id="infographic-modal" class="infographic-modal" onclick="closeInfographic()">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modal-img">
    </div>

    <!-- CONFIGURACIÓN SUPABASE Y PERSISTENCIA -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://bgnrjfanmheylutlroia.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_2YmXljKcXIsAXTZ8_XG9SA_V2sniyXQ';
        
        // Inicializar cliente de Supabase
        if (window.supabaseJs) {
            window.supabase = window.supabaseJs.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
    </script>
    <script src="persistence.js"></script>
    <script src="script_engine.js"></script>
    <script src="script_tactical.js"></script>
</body>

</html>
